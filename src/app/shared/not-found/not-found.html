<main class="relative min-h-screen bg-[#050505] text-[#FFFFFF] overflow-hidden flex items-center justify-center px-6 md:px-12 mt-6">

  <div class="absolute inset-0 bg-[radial-gradient(circle_at_20%_20%,rgba(200,163,0,0.18),transparent_30%),radial-gradient(circle_at_80%_30%,rgba(200,163,0,0.10),transparent_28%),linear-gradient(135deg,#050505_0%,#0A0A0A_45%,#050505_100%)]"></div>
  <div class="absolute top-1/2 left-1/2 w-[700px] h-[700px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-[#C8A300]/10 blur-3xl"></div>

  <section class="mt-20 relative z-10 max-w-5xl mx-auto flex flex-col items-center text-center">

    <div
      reveal="fade-up"
      class="relative leading-none"
    >
      <h1 class="font-display text-[clamp(7rem,24vw,18rem)] font-black uppercase tracking-tight text-[#FFFFFF]/10 select-none">
        404
      </h1>

      <div class="absolute inset-0 flex items-center justify-center">
        <span class="font-display text-[clamp(5rem,18vw,13rem)] font-black uppercase text-[#C8A300] drop-shadow-[0_0_30px_rgba(200,163,0,0.35)]">
          404
        </span>
      </div>
    </div>

    <div
      reveal="fade-up"
      [revealDelay]="120"
      class="flex flex-col items-center gap-6 -mt-2"
    >
      <p class="text-[#C8A300] font-black tracking-[0.35em] uppercase text-sm md:text-base">
        Panthera Project
      </p>

      <h2 class="font-display text-4xl md:text-6xl lg:text-7xl uppercase leading-none">
        Página no
        <span class="text-[#C8A300]">encontrada</span>
      </h2>

      <p class="max-w-2xl text-lg md:text-2xl text-[#FFFFFF]/70 leading-relaxed italic">
        Puede que hayas tomado un camino equivocado.
        <br />
        Vuelve y sigue avanzando con intención.
      </p>
    </div>

    <div
      reveal="fade-up"
      [revealDelay]="240"
      class="flex flex-col sm:flex-row gap-4 mt-10"
    >
      <a
        routerLink="/"
        class="btn-wave inline-flex items-center justify-center border-2 border-[#C8A300] text-[#C8A300] px-8 py-4 rounded-lg font-black relative overflow-hidden transition hover:bg-[#C8A300] hover:text-[#050505]"
      >
        <span>VOLVER AL INICIO</span>
      </a>

      <a
        routerLink="/contacto"
        class="inline-flex items-center justify-center border-2 border-[#FFFFFF]/15 text-[#FFFFFF]/75 px-8 py-4 rounded-lg font-black hover:border-[#C8A300] hover:text-[#C8A300] transition"
      >
        CONTACTO
      </a>
    </div>

    <div
      reveal="fade-up"
      [revealDelay]="360"
      class="mt-20"
    >
      <p class="font-display text-2xl md:text-4xl uppercase text-[#FFFFFF]/15 tracking-wide">
        Train. Evolve. Repeat.
      </p>
    </div>

  </section>

</main>
